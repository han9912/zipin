name: Build and release Zipin MVP

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zipin_mvp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and package the MVP backend
        run: bash ./mvnw -B -P opportunity-mvp '-Dtest=Opportunity*Test,Telegram*Test,Jwt*Test' verify
        env:
          DB_URL: jdbc:mysql://localhost:3306/zipin_mvp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble versioned release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/zipin-release"
          mkdir -p "$package_dir/backend" "$package_dir/frontend"
          jar_path="$(find target -maxdepth 1 -type f -name 'zipin-*.jar' ! -name '*.jar.original' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" "$package_dir/backend/zipin-mvp.jar"
          cp -R frontend/dist/. "$package_dir/frontend/"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/COMMIT"
          archive="zipin-${GITHUB_REF_NAME}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$archive" zipin-release
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")

      - name: Upload release bundle for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zipin-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zipin-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/zipin-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: zipin-release-${{ github.sha }}
          path: release

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "release/zipin-${GITHUB_REF_NAME}.tar.gz"
          "release/zipin-${GITHUB_REF_NAME}.tar.gz.sha256"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes
