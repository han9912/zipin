spring:
  redis:
    host: localhost
    port: 6379

  data:
    redis:
      repositories:
        enabled: false

  application:
    name: zipin

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zipin_mvp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  main:
    allow-bean-definition-overriding: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: lax

zipin:
  auth:
    telegram:
      enabled: ${TELEGRAM_OIDC_ENABLED:false}
      client-id: ${TELEGRAM_CLIENT_ID:}
      client-secret: ${TELEGRAM_CLIENT_SECRET:}
      redirect-uri: ${TELEGRAM_REDIRECT_URI:http://localhost:5173/api/auth/telegram/callback/telegram}
      frontend-url: ${APP_FRONTEND_URL:http://localhost:5173/}
      jwt-secret: ${ZIPIN_JWT_SECRET:}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: info
    io.github.han9912.zipin: debug
  file:
    name: logs/app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: "this-is-a-strong-secret-key-with-32+-bytes"

redisson:
  address: redis://127.0.0.1:6379

mybatis:
  mapper-locations: classpath:mappers/*.xml